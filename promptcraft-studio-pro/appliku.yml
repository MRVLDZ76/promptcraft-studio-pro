      value: "AIzaSyCY3udTgn0702PvBSGsgZgZOG-JBbr9Ph8"
    
    # Stripe Configuration (for subscriptions)
    - name: "VITE_STRIPE_PUBLISHABLE_KEY"
      value: "pk_live_YOUR_STRIPE_PUBLISHABLE_KEY_HERE"
    
    # Application Settings
    - name: "VITE_APP_NAME"
      value: "PromptCraft Studio Pro"
    - name: "VITE_APP_URL"
      value: "https://studio.ppall.io"
    - name: "VITE_APP_DOMAIN"
      value: "ppall.io"
    
    # Environment
    - name: "NODE_ENV"
      value: "production"
    - name: "VITE_ENV"
      value: "production"
    
    # Build Configuration
    - name: "VITE_BUILD_MODE"
      value: "production"
    - name: "VITE_SOURCEMAP"
      value: "false"

services:
  # Build step: Install dependencies and build static files
  release:
    command: "npm install && npm run build"
  
  # Serve static files using Node.js static server
  web:
    scale: 1
    command: "npx serve -s dist -l 8080 --single"
    # Alternative using http-server:
    # command: "npx http-server dist -p 8080 -c-1 --proxy https://studio.ppall.io?"

# No databases needed for frontend (uses backend API and Supabase)

# Appliku Configuration for Backend
# Root-level config for monorepo deployment

build_settings:
  dockerfile: backend/Dockerfile
  build_context: backend
  environment_variables:
    - name: "DJANGO_DEBUG"
      value: "False"
    - name: "DJANGO_SETTINGS_MODULE"
      value: "config.settings.production"
    - name: "DJANGO_SECRET_KEY"
      value: "FKG2T6pv4dAD5HLypZRK2Il9RaaDvFCnpHTmxf5rbcDt0UtOZam6JQQJ99BHACYeBjFXJ3w3AAALACOGhbOW"
    - name: "DJANGO_ADMIN_URL"
      value: "admin/"
    - name: "DJANGO_ALLOWED_HOSTS"
      value: "bcknd.ppall.io,backend.ppall.io,ppall.io,www.ppall.io,studio.ppall.io"
    - name: "COOKIE_DOMAIN"
      value: ".ppall.io"
    - name: "SESSION_COOKIE_SECURE"
      value: "True"
    - name: "CSRF_COOKIE_SECURE"
      value: "True"
    
    # Database Configuration
    - name: "DATABASE_URL"
      from_database:
        name: "studio"
        property: "connection_url"
    - name: "DATABASES_DEFAULT_CONN_MAX_AGE"
      value: "60"
    - name: "DB_CONN_MAX_AGE"
      value: "60"
    
    # Frontend Configuration
    - name: "FRONTEND_URL"
      value: "https://studio.ppall.io"
    - name: "CORS_ALLOWED_ORIGINS"
      value: "https://studio.ppall.io,https://ppall.io,https://www.ppall.io"
    
    # Redis Configuration
    - name: "REDIS_URL"
      from_database:
        name: "studio-redis"
        property: "connection_url"
    - name: "CELERY_BROKER_URL"
      from_database:
        name: "studio-redis"
        property: "connection_url"
    
    # AWS S3 Configuration (DigitalOcean Spaces)
    - name: "AWS_ACCESS_KEY_ID"
      value: "DO00AXNUV27VNRP64GGF"
    - name: "AWS_SECRET_ACCESS_KEY"
      value: "YOUR_SECRET_KEY_HERE"
    - name: "AWS_STORAGE_BUCKET_NAME"
      value: "businessesppall"
    - name: "AWS_S3_REGION_NAME"
      value: "nyc3"
    - name: "AWS_S3_ENDPOINT_URL"
      value: "https://nyc3.digitaloceanspaces.com"
    - name: "AWS_S3_CUSTOM_DOMAIN"
      value: "businessesppall.nyc3.cdn.digitaloceanspaces.com"
    - name: "AWS_LOCATION"
      value: "studio/media"
    - name: "AWS_DEFAULT_ACL"
      value: "public-read"

services:
  release:
    command: "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear"
  web:
    scale: 1
    command: "/code/start_server.sh"
  worker:
    scale: 1
    command: "celery -A config.celery_app worker --loglevel=info --concurrency=4"
  beat:
    scale: 1
    command: "celery -A config.celery_app beat --loglevel=info"
  flower:
    scale: 1
    command: "celery -A config.celery_app flower --port=5555"

databases:
  studio:
    type: postgresql_16
  studio-redis:
    type: redis_7

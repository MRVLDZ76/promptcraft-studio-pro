services:
  release:
    command: "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear"
  web:
    scale: 1
    command: "/code/start_server.sh"
  worker:
    scale: 1
    command: "celery -A config.celery_app worker --loglevel=info --concurrency=4"
  beat:
    scale: 1
    command: "celery -A config.celery_app beat --loglevel=info"
  flower:
    scale: 1
    command: "celery -A config.celery_app flower --port=5555"

databases:
  studio:
    type: postgresql_16
  studio-redis:
    type: redis_7